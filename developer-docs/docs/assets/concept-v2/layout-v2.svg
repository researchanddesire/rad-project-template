<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
<title>Concept 02 — one T-shaped PCB in the toy XY plane</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="context-stroke"/></marker></defs>
<rect width="1400" height="1040" fill="white"/>
<text x="34" y="56.0" font-family="Arial, sans-serif" font-size="36" fill="#213047" font-weight="bold" text-anchor="start">Concept 02 / PCB follows the toy’s XY silhouette</text>
<text x="36" y="95.0" font-family="Arial, sans-serif" font-size="21" fill="#57657a" font-weight="normal" text-anchor="start">One continuous T-shaped board · X across the handle · Y toward the tip · Z normal to the board</text>
<rect x="30" y="135" width="690" height="730" rx="15" fill="#f5f7fa" fill-opacity="1" stroke="#d8dfeb" stroke-width="2"/>
<rect x="750" y="135" width="620" height="730" rx="15" fill="#f5f7fa" fill-opacity="1" stroke="#d8dfeb" stroke-width="2"/>
