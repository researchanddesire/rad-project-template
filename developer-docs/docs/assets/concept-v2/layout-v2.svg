<text x="1050" y="470.0" font-family="Arial, sans-serif" font-size="22" fill="#b56612" font-weight="bold" text-anchor="start">Motor sleeve</text>
<text x="1050" y="499.0" font-family="Arial, sans-serif" font-size="18" fill="#213047" font-weight="normal" text-anchor="start">Ø13 mm reservation</text>
<text x="1050" y="526.0" font-family="Arial, sans-serif" font-size="18" fill="#213047" font-weight="normal" text-anchor="start">2 mm separation</text>
<polyline points="997,520 1035,520" fill="none" stroke="#b56612" stroke-width="2"/>
<text x="780" y="645.0" font-family="Arial, sans-serif" font-size="18" fill="#176bc1" font-weight="bold" text-anchor="start">1 mm PCB</text>
<polyline points="890,638 914,638" fill="none" stroke="#176bc1" stroke-width="2"/>
<text x="776" y="721.0" font-family="Arial, sans-serif" font-size="20" fill="#213047" font-weight="bold" text-anchor="start">Motor overlap:</text>
<text x="776" y="750.0" font-family="Arial, sans-serif" font-size="19" fill="#213047" font-weight="normal" text-anchor="start">13 motor + 2 gap + 1 PCB = 16 mm internal Z</text>
<text x="776" y="792.0" font-family="Arial, sans-serif" font-size="20" fill="#213047" font-weight="bold" text-anchor="start">Base overlap:</text>
<text x="776" y="821.0" font-family="Arial, sans-serif" font-size="19" fill="#213047" font-weight="normal" text-anchor="start">10 pack + 2 gap + 5 PCB assembly = 17 mm</text>
<rect x="30" y="892" width="1340" height="114" rx="15" fill="#fff5e6" fill-opacity="1" stroke="#efcf98" stroke-width="2"/>
<text x="54" y="925.0" font-family="Arial, sans-serif" font-size="23" fill="#b56612" font-weight="bold" text-anchor="start">The board follows an inward-offset carrier cavity, not the outer silicone skin.</text>
<text x="54" y="955.0" font-family="Arial, sans-serif" font-size="19" fill="#213047" font-weight="normal" text-anchor="start">All dimensions are study inputs. Z totals exclude carrier, silicone, adhesives, tolerances and actual part clearances.</text>
<text x="54" y="983.0" font-family="Arial, sans-serif" font-size="19" fill="#213047" font-weight="normal" text-anchor="start">KiCad / DXF outputs contain a rounded board outline only. No electrical layout, fit or fabrication validation.</text>
</svg>
