<text x="64" y="470.0" font-family="Arial, sans-serif" font-size="16" fill="#213047" font-weight="normal" text-anchor="middle">83 mm</text>
<text x="64" y="494.0" font-family="Arial, sans-serif" font-size="14" fill="#213047" font-weight="normal" text-anchor="middle">PCB length</text>
<text x="55" y="789.0" font-family="Arial, sans-serif" font-size="17" fill="#57657a" font-weight="normal" text-anchor="start">Dashed green/orange shapes are projections of parts in +Z.</text>
<text x="55" y="817.0" font-family="Arial, sans-serif" font-size="17" fill="#57657a" font-weight="normal" text-anchor="start">Purple contour is illustrative; it is not a released toy outline.</text>
