<text x="776" y="178.0" font-family="Arial, sans-serif" font-size="26" fill="#176bc1" font-weight="bold" text-anchor="start">YZ section — look along X</text>
<text x="776" y="208.0" font-family="Arial, sans-serif" font-size="18" fill="#213047" font-weight="normal" text-anchor="start">Board, pack and motor occupy separate Z volumes.</text>
