<rect x="930.5" y="470" width="65" height="170" rx="17" fill="#f5cca0" fill-opacity="1" stroke="#b56612" stroke-width="2"/>
<polyline points="918,232 1058,232" fill="none" stroke="#213047" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1064" y="238.0" font-family="Arial, sans-serif" font-size="18" fill="#213047" font-weight="normal" text-anchor="start">+Z</text>
<polyline points="918,260 918,744" fill="none" stroke="#176bc1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1050" y="280.0" font-family="Arial, sans-serif" font-size="22" fill="#26755b" font-weight="bold" text-anchor="start">Battery bay</text>
<text x="778" y="286.0" font-family="Arial, sans-serif" font-size="17" fill="#176bc1" font-weight="bold" text-anchor="start">4 mm parts</text>
<text x="778" y="311.0" font-family="Arial, sans-serif" font-size="16" fill="#213047" font-weight="normal" text-anchor="start">on −Z side</text>
<polyline points="873,295 893,295" fill="none" stroke="#176bc1" stroke-width="2"/>
<text x="1050" y="309.0" font-family="Arial, sans-serif" font-size="19" fill="#213047" font-weight="normal" text-anchor="start">10 mm in Z</text>
<text x="1050" y="336.0" font-family="Arial, sans-serif" font-size="18" fill="#213047" font-weight="normal" text-anchor="start">2 mm gap to board</text>
