<text x="52" y="718.0" fill="#596a7b" font-family="Arial,sans-serif" font-size="18" font-weight="normal">Watch: shared heat paths, mass and the flange joint.</text>
<text x="788" y="718.0" fill="#596a7b" font-family="Arial,sans-serif" font-size="18" font-weight="normal">Watch: retention and cleaning at the tip joint.</text>
<text x="52" y="748.0" fill="#596a7b" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Metal casting grade, surface finish and sealing TBD.</text>
<text x="788" y="748.0" fill="#596a7b" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Material, thermal bond and sealing TBD.</text>
<rect x="28" y="802" width="1444" height="131" rx="16" fill="#eff4fa" stroke="#d8e3f0"/>
<text x="52" y="841.0" fill="#35679d" font-family="Arial,sans-serif" font-size="24" font-weight="bold">RF window: reserve real space around the antenna</text>
<text x="52" y="875.0" fill="#596a7b" font-family="Arial,sans-serif" font-size="19" font-weight="normal">Use the whole polymer flange for the antenna region. Keep nearby metal and component clutter away.</text>
<text x="52" y="904.0" fill="#596a7b" font-family="Arial,sans-serif" font-size="19" font-weight="normal">A plastic patch alone does not establish radio performance; window size and final WiFi/BLE testing remain open.</text>
<text x="38" y="970.0" fill="#975d15" font-family="Arial,sans-serif" font-size="18" font-weight="normal">Plan A selected • material colors only • alloy, wall section, dimensions, sensing accuracy and cleaning remain unvalidated</text>
