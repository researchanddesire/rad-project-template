<text x="788" y="177.0" fill="#243449" font-family="Arial,sans-serif" font-size="25" font-weight="bold">B / Alternative: local metal sensing tip</text>
<text x="52" y="210.0" fill="#596a7b" font-family="Arial,sans-serif" font-size="18" font-weight="normal">Hollow cast body with a finished metal contact surface.</text>
<text x="788" y="210.0" fill="#596a7b" font-family="Arial,sans-serif" font-size="18" font-weight="normal">Unselected comparison for a localized sensing path.</text>
