<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<title>Plan A selected — hollow metal body and polymer flange</title>
<desc>Editable non-dimensional material comparison. Left: selected Plan A, hollow metal body and polymer flange. Right: unselected Plan B, local metal tip and insulating body. Both retain a nonmetal antenna region in the flange.</desc>
<defs><path id="profile" d="M 0 -222 C 22 -222 48 -191 53 -154 C 59 -113 39 -79 22 -52 C 15 -41 14 -24 20 -15 C 38 -4 69 -11 100 -6 C 123 -3 141 11 145 21 C 151 32 148 40 135 42 C 99 47 49 38 5 31 C -28 26 -71 38 -120 37 C -144 36 -151 25 -140 11 C -128 -4 -94 -10 -63 -12 C -36 -14 -21 -16 -19 -30 C -18 -44 -27 -62 -39 -83 C -61 -124 -55 -166 -35 -194 C -23 -211 -9 -222 0 -222 Z"/><clipPath id="flange"><rect x="-160" y="-15" width="320" height="100"/></clipPath><clipPath id="tip"><rect x="-90" y="-240" width="180" height="55"/></clipPath><clipPath id="silhouette"><use href="#profile"/></clipPath></defs>
<rect width="1500" height="1000" fill="white"/>
<text x="36" y="52.0" fill="#243449" font-family="Arial,sans-serif" font-size="34" font-weight="bold">Material study / conductivity where the sensor needs it</text>
<text x="38" y="90.0" fill="#596a7b" font-family="Arial,sans-serif" font-size="22" font-weight="normal">Goal: better tip temperature sensing, with an easy-to-clean finished surface.</text>
