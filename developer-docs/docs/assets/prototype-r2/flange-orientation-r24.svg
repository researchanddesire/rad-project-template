<text x="29" y="792" font-family="Arial,sans-serif" font-size="21" fill="#56677b" font-weight="normal">Y-rotation clears the saved fixed context. Antenna, buttons, flex, assembly route and physical fit remain open.</text>
<text x="29" y="831" font-family="Arial,sans-serif" font-size="21" fill="#56677b" font-weight="normal">All exterior shapes unchanged. Dimensions alone do not qualify comfort or flange motion.</text>
