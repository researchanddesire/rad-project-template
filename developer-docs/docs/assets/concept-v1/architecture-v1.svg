<text x="766" y="424.0" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#213047" text-anchor="start">Main PCB; shared I²C</text>
<text x="766" y="448.3" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#213047" text-anchor="start">Interrupt + purpose TBD</text>
