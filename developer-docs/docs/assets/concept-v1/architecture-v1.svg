<text x="53" y="495.0" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#a15a08" text-anchor="start">to an unverified 4.2 / 4.4 V rail.</text>
<rect x="750" y="765" width="230" height="85" rx="16" fill="#eaf3ff" stroke="#176bc1" stroke-width="2"/>
<text x="766" y="795.0" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#176bc1" text-anchor="start">Power + mode</text>
