<polyline points="980,810 1380,810 1380,225 1350,225" fill="none" stroke="#176bc1" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="42" y="790.0" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#213047" text-anchor="start">Proposed first-prototype behavior</text>
<text x="42" y="824.0" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#213047" text-anchor="start">Motor off at boot, docked, or fault. Local stop has priority.</text>
<text x="42" y="856.0" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#213047" text-anchor="start">Power-off vs sleep still needs a circuit decision.</text>
<text x="38" y="900.0" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#57657a" text-anchor="start">SYS is nominally 4.4 V on external power; full cell is 4.2 V. Motor rating: 3.7 V. Sources in the design proposal.</text>
