<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<title>Concept 01 — illustrative 24-hour battery-charge scenarios</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="34" y="53.0" font-family="Arial, sans-serif" font-size="37" font-weight="bold" fill="#213047" text-anchor="start">24-hour charge budget / scenario study</text>
<text x="36" y="90.0" font-family="Arial, sans-serif" font-size="21" font-weight="normal" fill="#57657a" text-anchor="start">Assumed battery-side base current + motor branch; 20% cell capacity allowance. No measured runtime.</text>
