<text x="904.0" y="132.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#26755b" text-anchor="middle">1000 mAh cell: 800 usable</text>
<text x="36" y="194.0" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#213047" text-anchor="start">Occasional use</text>
