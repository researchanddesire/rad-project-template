site_name: Buttplug Compass Developer Docs
site_description: Current prototype requirements, design, hardware and bench firmware.
repo_url: https://github.com/researchanddesire/buttplug
edit_uri: edit/main/developer-docs/docs/
use_directory_urls: false
theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
plugins:
  - search
  - awesome-pages
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
