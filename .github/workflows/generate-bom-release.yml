name: Generate BOM release artifact

on:
  push:
    tags:
      - 'v*'

jobs:
  bom:
    uses: researchanddesire/assembly-docs/.github/workflows/bom-release.yml@main
    permissions:
      contents: write
    with:
      product: Buttplug Compass
      repo_url: https://github.com/researchanddesire/buttplug
      license: License pending
