metadata:
  title: R36 dual-NTC pack adapter - prototype fixture recipe
  description: R35F copper lands to two factory-leaded NTCs; separate sensor return branches at one insulated joint.
  notes: Power ends are parked, not a completed battery mate. Starting blanks are trimmed on a fixture. No purchase or assembly release.
options:
  fontname: Arial
  color_mode: FULL
connectors:
  J2-R35:
    type: Copper-only body-board lands - no populated header
    pins: [1, '2S', '2P', 3, 4]
    pinlabels: [PACK_P, GND_SENSE, GND_POWER, PACK_NTC, PACK_GUARD]
    ignore_in_bom: true
    notes: "2S and 2P are two physical lands on native logical pin 2/GND.\nDo not populate the old Pico-Lock header. Pin view is numeric, not mating-face orientation."
  POWER-PARK:
    type: Unfinished protected-pack mate - parked coated ends
    pins: [P+, P-]
    ignore_in_bom: true
    notes: "Not a connector selection or completed battery adapter.\nBattery OPEN; do not connect a live pack from this diagram."
  Y-RETURN:
    type: Insulated three-way sensor return joint - process candidate
    pins: [1, 2, 3]
    pinlabels: [IN, LOWER, UPPER]
    loops: [[1, 2], [1, 3]]
    ignore_in_bom: true
    notes: "Three separately stripped wire ends may be joined on a fixture.\nThe CAD continuous core is a geometric process budget, not a demand for midspan stripping.\nSolder, insulation and force bypass must be qualified."
  LAP-TH1:
    type: Two separate insulated lap joints - process candidate
    pins: [1, 2, 3, 4]
    pinlabels: [S-IN, S-FACTORY, G-IN, G-FACTORY]
    loops: [[1, 2], [3, 4]]
    ignore_in_bom: true
    notes: "TH1 signal and ground are separate insulated joints.\nEach targets OD1.8 x5 mm; bare ends have separate offset paths."
  LAP-TH2:
    type: Two separate insulated lap joints - process candidate
    pins: [1, 2, 3, 4]
    pinlabels: [S-IN, S-FACTORY, G-IN, G-FACTORY]
    loops: [[1, 2], [3, 4]]
    ignore_in_bom: true
    notes: "TH2 signal and ground are separate insulated joints.\nEach targets OD1.8 x5 mm; bare ends have separate offset paths."
  TH1:
    type: Factory-leaded NTC candidate - charge sensor
    manufacturer: Vishay
    mpn: NTCLE413E2103F524A
    pins: [1, 2]
    pinlabels: [PACK_NTC, GND_SENSE]
    notes: "52 +/-5 mm is total body-tip to wire-end length, not available lead length.\nFactory leads included; do not buy four extra factory wires.\nNonpolar NTC; diagram assigns pin 1 signal, pin 2 ground."
  TH2:
    type: Factory-leaded NTC candidate - independent guard
    manufacturer: Vishay
    mpn: NTCLE413E2103F524A
    pins: [1, 2]
    pinlabels: [PACK_GUARD, GND_SENSE]
    notes: "Same factory lead and attachment restrictions as TH1.\nNo coating compression, hard potting or strain transfer into the heads."
cables:
  W-BODY:
    category: bundle
    type: Independent prototype starting blanks - trim to fixture
    manufacturer: Accu-Glass
    mpn: '100690'
    gauge: 28
    gauge_unit: AWG
    wirecount: 5
    colors: [BN, BN, BN, BN, BN]
    wirelabels: [PACK_P, GND_SENSE, GND_POWER, PACK_NTC, PACK_GUARD]
    length: 0.120
    length_unit: m
    notes: "Five 120 mm STARTING blanks; not finished cable lengths or service slack.\nWire2 is trimmed at the return junction; lower/upper return legs are separate below.\nOD0.60 is a design allowance, not supplier maximum. Current/temperature/process unqualified."
  W-RETURN-LEGS:
    category: bundle
    type: Two short sensor-return starting blanks
    manufacturer: Accu-Glass
    mpn: '100690'
    gauge: 28
    gauge_unit: AWG
    wirecount: 2
    colors: [BN, BN]
    wirelabels: [TH1_GND, TH2_GND]
    length: 0.030
    length_unit: m
    notes: 30 mm STARTING blanks; trim and strip on the joint fixture. No finished length inferred.
  W-TH1-FACTORY:
    category: bundle
    type: Included TH1 factory leads - not separate purchased wire
    wirecount: 2
    colors: [BN, BN]
    wirelabels: ['pin1 / CAD lead1_2', 'pin2 / CAD lead1_1']
    ignore_in_bom: true
    notes: "Length intentionally unspecified here. Native R36 has full coated path and bare lap target.\nDo not trim at the old 4.5 mm stub or interpret total52 mm as lead length."
  W-TH2-FACTORY:
    category: bundle
    type: Included TH2 factory leads - not separate purchased wire
    wirecount: 2
    colors: [BN, BN]
    wirelabels: ['pin1 / CAD lead2_1', 'pin2 / CAD lead2_2']
    ignore_in_bom: true
    notes: Same factory-lead/process scope as TH1; no duplicate child BOM wire.
connections:
  - - J2-R35: [1, '2P']
    - W-BODY: [1, 3]
    - POWER-PARK: [P+, P-]
  - - J2-R35: ['2S']
    - W-BODY: [2]
    - Y-RETURN: [1]
  - - J2-R35: [3]
    - W-BODY: [4]
    - LAP-TH1: [1]
  - - J2-R35: [4]
    - W-BODY: [5]
    - LAP-TH2: [1]
  - - Y-RETURN: [2]
    - W-RETURN-LEGS: [1]
    - LAP-TH1: [3]
  - - Y-RETURN: [3]
    - W-RETURN-LEGS: [2]
    - LAP-TH2: [3]
  - - LAP-TH1: [2, 4]
    - W-TH1-FACTORY: [1, 2]
    - TH1: [1, 2]
  - - LAP-TH2: [2, 4]
    - W-TH2-FACTORY: [1, 2]
    - TH2: [1, 2]
additional_bom_items:
  - description: Insulation and solder process material for four lap joints and one return junction - supplier/process OPEN
    qty: 5
    unit: sets
tweak:
  append: 'graph [label="R36 / PROTOTYPE SENSOR ADAPTER ONLY\nPower mate, restraint and connected loading unfinished; starting material is not a purchase release", labelloc=t, labeljust=l, fontsize=18, fontname="Arial"];'
