additional_bom_items:
- description: Solder/insulation process set - unspecified prototype target
  qty: 7
  unit: set
- description: Power-lap compliant cuff target - material and preload OPEN
  qty: 2
  unit: piece
tweak:
  append: graph [label="R39 / CONDITIONAL PACK ADAPTER\nBattery OPEN; receiving dimensions and actual joint/cuff
    process require qualification", labelloc=t, labeljust=l, fontsize=18, fontname="Arial"];
